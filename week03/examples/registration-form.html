<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form Example - BMIS 263</title>
</head>
<body>

    <h1>Course Registration Form</h1>
    <p>This example demonstrates all the form input types covered in Week 3.</p>

    <form>

        <!-- TEXT INPUT: single-line text field -->
        <label for="fullname">Full Name:</label><br>
        <input type="text" id="fullname" name="fullname" placeholder="e.g. Adamu Bello" required><br><br>

        <!-- EMAIL INPUT: validates email format automatically -->
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" placeholder="you@example.com" required><br><br>

        <!-- PASSWORD INPUT: hides typed characters -->
        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" placeholder="At least 8 characters" required><br><br>

        <!-- NUMBER INPUT: only accepts numbers, with min/max constraints -->
        <label for="age">Age:</label><br>
        <input type="number" id="age" name="age" min="16" max="60"><br><br>

        <!-- DATE INPUT: provides a date picker in modern browsers -->
        <label for="dob">Date of Birth:</label><br>
        <input type="date" id="dob" name="dob"><br><br>

        <!-- RADIO BUTTONS: user picks exactly one option -->
        <!-- All radios in the same group must share the same "name" attribute -->
        <p>Gender:</p>
        <label><input type="radio" name="gender" value="male" required> Male</label><br>
        <label><input type="radio" name="gender" value="female"> Female</label><br><br>

        <!-- DROPDOWN (SELECT): user picks one from a list -->
        <label for="course">Course:</label><br>
        <select id="course" name="course" required>
            <option value="">-- Select your course --</option>
            <option value="bmis">Management Information Systems</option>
            <option value="bcs">Computer Science</option>
            <option value="bba">Business Administration</option>
        </select><br><br>

        <!-- CHECKBOXES: user can pick zero, one, or many options -->
        <p>Interests (select all that apply):</p>
        <label><input type="checkbox" name="interests" value="sports"> Sports</label><br>
        <label><input type="checkbox" name="interests" value="music"> Music</label><br>
        <label><input type="checkbox" name="interests" value="reading"> Reading</label><br><br>

        <!-- TEXTAREA: multi-line text input -->
        <label for="bio">About You:</label><br>
        <textarea id="bio" name="bio" rows="4" cols="50" placeholder="Write a short bio..."></textarea><br><br>

        <!-- SUBMIT BUTTON -->
        <button type="submit">Register</button>

    </form>

</body>
</html>
