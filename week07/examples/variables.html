<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variables Demo - BMIS 263 Week 7</title>
</head>
<body>

    <h1>JavaScript Variables and Data Types</h1>
    <p>Open the browser console (F12) to see all output from this demo.</p>

    <script>
        // ============================================
        // DECLARING VARIABLES
        // ============================================

        // const: value cannot be changed after assignment
        const universityName = "Lincoln University";
        const pi = 3.14159;

        // let: value can be changed later
        let score = 0;
        let playerName = "Player 1";

        // Changing a let variable
        score = 50;
        score = 100;
        console.log("Score after updates:", score);   // 100

        // Trying to change a const would cause an error:
        // universityName = "Another University";   // ERROR!

        // ============================================
        // DATA TYPES
        // ============================================

        // String: text in quotes
        let city = "Lagos";
        let greeting = 'Hello!';

        // Number: integers and decimals, no quotes
        let year = 2026;
        let temperature = 28.5;

        // Boolean: true or false, no quotes
        let isRaining = false;
        let hasAccount = true;

        // Undefined: declared but no value assigned
        let middleName;
        console.log("middleName:", middleName);       // undefined

        // Null: intentionally empty
        let selectedItem = null;
        console.log("selectedItem:", selectedItem);    // null

        // ============================================
        // typeof OPERATOR
        // ============================================

        console.log("--- Data Type Checks ---");
        console.log(typeof city);            // "string"
        console.log(typeof year);            // "number"
        console.log(typeof temperature);     // "number"
        console.log(typeof isRaining);       // "boolean"
        console.log(typeof middleName);      // "undefined"
        console.log(typeof selectedItem);    // "object" (known JavaScript quirk)

        // ============================================
        // STRING CONCATENATION vs. TEMPLATE LITERALS
        // ============================================

        let firstName = "Adamu";
        let lastName = "Bello";
        let age = 21;

        // Old way: concatenation with +
        let intro1 = "My name is " + firstName + " " + lastName + ". I am " + age + ".";
        console.log("Concatenation:", intro1);

        // Modern way: template literals with backticks
        let intro2 = `My name is ${firstName} ${lastName}. I am ${age}.`;
        console.log("Template literal:", intro2);

        // ============================================
        // THE STRING + NUMBER TRAP
        // ============================================

        console.log("--- String + Number Trap ---");
        console.log("5" + 3);        // "53" -- string wins, concatenation
        console.log(5 + 3);          // 8   -- both numbers, addition
        console.log("10" - 5);       // 5   -- subtraction converts string to number
        console.log("10" * 2);       // 20  -- multiplication converts string to number
        console.log("hello" * 2);    // NaN -- "hello" cannot be converted to a number

        // NaN means "Not a Number" -- it appears when a math operation
        // involves a value that cannot be treated as a number.
    </script>

</body>
</html>
