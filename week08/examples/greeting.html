<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input/Output Demo - BMIS 263 Week 8</title>
</head>
<body>

    <h1>Input and Output Demo</h1>
    <p>This page demonstrates collecting input with prompt() and displaying output.</p>

    <!-- This paragraph will be updated by JavaScript -->
    <h2>Results</h2>
    <p id="greeting-result">Waiting for input...</p>
    <p id="calc-result"></p>

    <script>
        // ============================================
        // EXAMPLE 1: Greeting with prompt() and alert()
        // ============================================

        let name = prompt("What is your name?");

        // Display in an alert
        alert(`Hello, ${name}!`);

        // Also display on the page itself (preview of Week 12 DOM)
        document.getElementById("greeting-result").textContent = `Hello, ${name}! Welcome to the demo.`;

        // ============================================
        // EXAMPLE 2: Arithmetic with type conversion
        // ============================================

        let num1 = parseFloat(prompt("Enter a number:"));
        let num2 = parseFloat(prompt("Enter another number:"));

        // Without parseFloat, "5" + "3" would give "53" instead of 8
        let sum = num1 + num2;
        let product = num1 * num2;

        // Display on the page
        document.getElementById("calc-result").textContent =
            `${num1} + ${num2} = ${sum} | ${num1} * ${num2} = ${product}`;

        // Also log to console for debugging
        console.log("Inputs:", num1, num2);
        console.log("Sum:", sum);
        console.log("Product:", product);
        console.log("Types:", typeof num1, typeof num2);

        // ============================================
        // EXAMPLE 3: What happens WITHOUT parseFloat
        // ============================================

        // Try this in the console to see the difference:
        // let a = prompt("Number?");  --> returns string
        // console.log(a + 5);         --> concatenation, not addition
        // console.log(parseFloat(a) + 5);  --> correct addition

        console.log("--- Without conversion ---");
        console.log("'5' + 3 =", "5" + 3);           // "53"
        console.log("--- With conversion ---");
        console.log("parseFloat('5') + 3 =", parseFloat("5") + 3);  // 8
    </script>

</body>
</html>
