<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Demo - BMIS 263 Week 12</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            max-width: 700px;
            margin: 0 auto;
            background-color: #fafafa;
        }
        .demo-box {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        button {
            padding: 8px 16px;
            margin: 4px;
            cursor: pointer;
            border: 1px solid #555;
            border-radius: 4px;
            background: #eee;
        }
        button:hover { background: #ddd; }
        .red-text { color: red; }
        .big-text { font-size: 24px; }
        .highlight { background-color: #fff3cd; padding: 5px; }
    </style>
</head>
<body>

    <h1>DOM Manipulation Demo</h1>

    <!-- Demo 1: Selecting and changing content -->
    <div class="demo-box">
        <h2>1. Changing Content</h2>
        <p id="demo-text">This text will be changed by JavaScript.</p>
        <button onclick="changeContent()">Change Content</button>
        <button onclick="resetContent()">Reset</button>
    </div>

    <!-- Demo 2: Changing styles -->
    <div class="demo-box">
        <h2>2. Changing Styles</h2>
        <p id="style-text">Style me with JavaScript!</p>
        <button onclick="makeRed()">Red Text</button>
        <button onclick="makeBig()">Big Text</button>
        <button onclick="addHighlight()">Highlight</button>
        <button onclick="removeAll()">Remove All</button>
    </div>

    <!-- Demo 3: Creating elements -->
    <div class="demo-box">
        <h2>3. Creating Elements</h2>
        <div id="list-container">
            <p>Click the button to add items:</p>
        </div>
        <button onclick="addListItem()">Add Item</button>
    </div>

    <!-- Demo 4: Reading form input without prompt -->
    <div class="demo-box">
        <h2>4. Reading Input from the Page</h2>
        <label for="name-input">Your name:</label>
        <input type="text" id="name-input" placeholder="Type your name">
        <button onclick="displayGreeting()">Greet Me</button>
        <p id="greeting-output"></p>
    </div>

    <script>
        // ---- Demo 1: Change and reset text content ----

        const originalText = "This text will be changed by JavaScript.";

        function changeContent() {
            let element = document.getElementById("demo-text");
            element.textContent = "The content has been changed by JavaScript!";
        }

        function resetContent() {
            let element = document.getElementById("demo-text");
            element.textContent = originalText;
        }

        // ---- Demo 2: Add and remove classes ----

        function makeRed() {
            document.getElementById("style-text").classList.add("red-text");
        }

        function makeBig() {
            document.getElementById("style-text").classList.add("big-text");
        }

        function addHighlight() {
            document.getElementById("style-text").classList.add("highlight");
        }

        function removeAll() {
            let el = document.getElementById("style-text");
            el.classList.remove("red-text", "big-text", "highlight");
        }

        // ---- Demo 3: Dynamically create elements ----

        let counter = 0;

        function addListItem() {
            counter++;
            let item = document.createElement("p");
            item.textContent = `Dynamic item #${counter}`;
            item.style.borderLeft = "3px solid #333";
            item.style.paddingLeft = "10px";
            document.getElementById("list-container").appendChild(item);
        }

        // ---- Demo 4: Read input from the page (no prompt!) ----

        function displayGreeting() {
            let nameInput = document.getElementById("name-input");
            let name = nameInput.value;     // .value reads what the user typed

            let output = document.getElementById("greeting-output");

            if (name === "") {
                output.textContent = "Please enter your name first.";
                output.style.color = "red";
            } else {
                output.textContent = `Hello, ${name}! Welcome to DOM manipulation.`;
                output.style.color = "green";
            }
        }
    </script>

</body>
</html>
